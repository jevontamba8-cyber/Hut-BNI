<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="bniOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#F37021" />
    </linearGradient>
    <linearGradient id="bniTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008075" />
      <stop offset="100%" stop-color="#005E54" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
  </defs>

  <!-- BNI 46 Emblem (Stylized Ribbon 46) -->
  <g transform="translate(10, 8)">
    <!-- 4 shape -->
    <path d="M 32 4 C 18 4 6 16 6 30 C 6 42 15 52 28 55 L 28 44 C 20 42 16 36 16 30 C 16 22 22 14 32 14 C 40 14 47 19 50 26 L 60 22 C 55 11 44 4 32 4 Z" fill="url(#bniTealGrad)" />
    <!-- 6 swoosh loop -->
    <path d="M 38 18 C 30 18 24 24 24 32 C 24 43 33 52 44 52 C 54 52 62 44 62 34 C 62 25 55 18 46 18 C 42 18 39 20 37 22 L 39 30 C 40 28 42 27 44 27 C 48 27 52 30 52 34 C 52 38 48 42 44 42 C 38 42 34 37 34 32 C 34 28 36 26 38 26 Z" fill="url(#bniOrangeGrad)" />
    <!-- Dynamic Accent Star -->
    <circle cx="56" cy="12" r="4" fill="url(#goldGrad)" />
  </g>

  <!-- Wordmark "BNI" -->
  <text x="88" y="52" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#005E54" letter-spacing="-1">B</text>
  <text x="120" y="52" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#005E54" letter-spacing="-1">N</text>
  <text x="156" y="52" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#F37021" letter-spacing="-1">I</text>

  <!-- Anniversary Tagline -->
  <g transform="translate(182, 22)">
    <rect x="0" y="0" width="128" height="18" rx="4" fill="url(#goldGrad)" opacity="0.2" />
    <text x="64" y="13" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#E65100" text-anchor="middle" letter-spacing="1.5">ANNIVERSARY</text>
    <text x="64" y="30" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#005E54" text-anchor="middle" letter-spacing="0.5">CELEBRATION</text>
  </g>
</svg>
